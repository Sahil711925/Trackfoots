name: CI

# The test suite is fully offline: every test points WITNESS_DATA at its own
# temp directory (os.tmpdir()) and forces ANCHOR_ON_CHAIN=false, so no local
# chain, ganache instance, or RPC endpoint is ever needed here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
